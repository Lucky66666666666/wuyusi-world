function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);let forward=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-joy.y;let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;let v=new THREE.Vector3(side,0,forward);if(v.length()>1)v.normalize();let speed=10;let sin=Math.sin(yaw),cos=Math.cos(yaw);let dx=(v.x*cos+v.z*sin)*speed*dt,dz=(-v.x*sin+v.z*cos)*speed*dt;player.position.x=THREE.MathUtils.clamp(player.position.x+dx,-78,78);player.position.z=THREE.MathUtils.clamp(player.position.z+dz,-78,78);if(v.lengthSq()>.01)player.rotation.y=Math.atan2(dx,dz);let target=new THREE.Vector3(player.position.x+Math.sin(yaw)*13,7+pitch*5,player.position.z+Math.cos(yaw)*13);camera.position.lerp(target,.09);camera.lookAt(player.position.x,1.2,player.position.z);let t=clock.elapsedTime;smoke.forEach(s=>{s.position.y=s.userData.baseY+Math.sin(t*s.userData.speed+s.userData.phase)*.5+t%5*.12;s.position.x+=Math.sin(t+s.userData.phase)*.0015;s.material.opacity=.12+Math.sin(t+s.userData.phase)*.04});if(Math.floor(t*3)%2===0)nearest();renderer.render(scene,camera)}animate();
