<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>无隅寺 · 九大区域</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101912;color:#f7eed8;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:14px;left:14px;z-index:5;background:#14251dcc;border:1px solid #b99b5a66;border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
#top strong{display:block;font-size:17px;letter-spacing:2px;color:#f4dfaa}#top small{color:#d6c9a8}
#help{position:fixed;right:14px;top:14px;z-index:5;background:#14251dcc;border:1px solid #b99b5a66;border-radius:12px;padding:10px 13px;font-size:12px;line-height:1.8;color:#eee2c6}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;background:#13251ee8;border:1px solid #c8a96a88;border-radius:12px;padding:12px 18px;min-width:230px;text-align:center;display:none;max-width:90vw}
#hint b{color:#f2d48d}#toast{position:fixed;top:95px;left:50%;transform:translateX(-50%);z-index:8;background:#17291eea;border:1px solid #c5a768;border-radius:10px;padding:10px 16px;display:none}
#sound{position:fixed;right:14px;bottom:18px;z-index:8;border:1px solid #c9aa69;background:#182b21;color:#f5e6c2;border-radius:22px;padding:10px 15px}
#panel{position:fixed;inset:0;z-index:10;background:#06100dcc;display:none;align-items:center;justify-content:center;padding:20px}
#panel .box{max-width:430px;width:100%;background:#1c3025;border:1px solid #c3a466;border-radius:18px;padding:24px;text-align:center;box-shadow:0 15px 60px #0009}
#panel h2{color:#f0d69b;margin:0 0 12px}#panel p{line-height:1.8;color:#e7dfca}#close{margin-top:12px;background:#b18a48;color:#1b2119;border:0;border-radius:20px;padding:10px 24px;font-size:15px}
#joy{position:fixed;left:22px;bottom:25px;width:116px;height:116px;border-radius:50%;background:#e9d8ad22;border:2px solid #e9d8ad66;z-index:7;display:none;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#e7d4a9bb;left:32px;top:32px;box-shadow:0 2px 10px #0007}
#look{position:fixed;right:0;bottom:0;width:48%;height:55%;z-index:4;touch-action:none}
@media(pointer:coarse){#joy{display:block}#help{font-size:11px;max-width:48vw}#top{top:10px;left:10px}#look{display:block}}
@media(pointer:fine){#look{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><strong>无隅寺</strong><small>九大区域 · 3D探索世界</small></div>
<div id="help">电脑：WASD 移动 · 鼠标拖动转向<br>靠近景点按 E 了解 · 滚轮缩放<br>手机：左侧摇杆移动 · 右侧滑动转向</div>
<div id="hint"></div><div id="toast"></div>
<button id="sound">♫ 声音：关闭</button>
<div id="joy"><div id="stick"></div></div><div id="look"></div>
<div id="panel"><div class="box"><h2 id="ptitle"></h2><p id="ptext"></p><button id="close">继续游览</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb7b0);scene.fog=new THREE.Fog(0x9eb7b0,48,135);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f2eb,0x59634a,2.0));
const sun=new THREE.DirectionalLight(0xffe5b5,2.2);sun.position.set(-28,45,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x526d4e));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,w,h,d,color){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function roof(x,z,w,d,y,color=0x704333){let g=new THREE.Group();let m=new THREE.Mesh(new THREE.ConeGeometry(1,1,4),mat(color));m.scale.set(w*.78,.95,d*.78);m.rotation.y=Math.PI/4;m.position.y=y;g.add(m);let ridge=box(0,0,0,w*1.45,.12,.16,0x3c2921);ridge.position.set(0,y+.5,0);g.add(ridge);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g)}
function building(x,z,w,d,h,color,label){
 box(x,h/2,z,w,h,d,color);for(let dx of [-w*.36,w*.36])for(let dz of [-d*.36,d*.36])box(x+dx,h/2,z+dz,.22,h+.2,.22,0x5b3527);
 roof(x,z,w,d,h+.35);
 box(x,h*.45,z+d/2+.012,w*.32,h*.78,.08,0x4b2e22);
 const sign=box(x,h+.15,z+d/2+.2,w*.45,.45,.08,0x9c7842);
 textSprite(label,x,h+.85,z+d/2+.25);
}
function textSprite(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='rgba(23,39,29,.86)';ctx.roundRect(4,4,504,120,18);ctx.fill();ctx.strokeStyle='#d5b875';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#f7e6bd';ctx.font='bold 54px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,66);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.position.set(x,y,z);s.scale.set(5.4,1.35,1);scene.add(s)}
function path(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),mat(0xb6a17a));m.position.set(x,.025,z);m.receiveShadow=true;scene.add(m)}
// Courtyard paths and central plaza
path(0,0,8,78);path(0,0,78,8);path(0,-22,5,30);path(0,22,5,30);path(-22,0,30,5);path(22,0,30,5);
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.12,48),mat(0xc3b28c));plaza.position.y=.08;scene.add(plaza);
const areas=[
{name:'大雄宝殿',x:0,z:-31,desc:'寺院主殿，晨钟暮鼓，清净庄严。未来可在这里加入礼佛、上香与祈愿互动。',w:18,d:12,h:7,c:0xb89a72},
{name:'千年古树',x:-31,z:-23,desc:'枝叶繁茂的千年古树，是游客静心休憩的地方。未来可加入树下许愿与季节变化。',tree:true},
{name:'清净大院',x:-31,z:0,desc:'安静开阔的寺院庭院，可漫步、观景，也将作为探索地图的重要连接区域。',yard:true},
{name:'斋面馆',x:31,z:-23,desc:'寺院斋面馆，炊烟袅袅。后续可加入点餐、用餐与斋饭互动。',w:12,d:10,h:4.5,c:0x9d7653},
{name:'灵鹿园',x:31,z:0,desc:'林木环绕的灵鹿园。后续可加入鹿群漫步、喂食和故事互动。',deer:true},
{name:'天机算命摊',x:-31,z:23,desc:'古朴的小摊位，未来可加入趣味签文与每日运势内容。',stall:true},
{name:'千愿桃树',x:0,z:31,desc:'寄托心愿的桃树。后续可加入祈愿牌、愿望展示与互动动画。',peach:true},
{name:'香火广场',x:0,z:0,desc:'寺院中心广场，是游客进入地图后的起点。未来可加入香炉、香火与祈愿系统。',center:true},
{name:'方丈禅院',x:31,z:23,desc:'清幽的方丈禅院，未来可加入方丈与僧人角色、禅坐和诵经场景。',w:12,d:10,h:4.8,c:0x9a8665}
];
building(0,-31,18,12,7,0xb99c75,'大雄宝殿');
building(31,-23,12,10,4.5,0x9c7959,'斋面馆');
building(31,23,12,10,4.8,0xa28c6c,'方丈禅院');
function tree(x,z,scale=1,leaf=0x315d3e){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*scale,.55*scale,4*scale,8),mat(0x60452d));trunk.position.set(x,2*scale,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<4;i++){let crown=new THREE.Mesh(new THREE.SphereGeometry((2.1-i*.15)*scale,12,10),mat(leaf));crown.position.set(x+(Math.random()-.5)*1.2*scale,4.2*scale+i*.65*scale,z+(Math.random()-.5)*1.2*scale);crown.castShadow=true;scene.add(crown)}}
tree(-31,-23,2.2,0x28583b);
for(let i=0;i<17;i++){let a=i/17*Math.PI*2;tree(-31+Math.cos(a)*6,-23+Math.sin(a)*6,.7,0x3c7148)}
// peach tree
tree(0,31,1.9,0x547c48);for(let i=0;i<18;i++){let a=i*2.4,r=1.2+Math.random()*1.4;let p=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),mat(0xe8a0a0));p.position.set(Math.cos(a)*r,4.2+Math.random()*2,31+Math.sin(a)*r);scene.add(p)}
// yard and deer enclosure
for(let x=-38;x<=-24;x+=2)for(let z=-6;z<=6;z+=2)if(Math.random()>.35)tree(x,z,.42,0x48764b);
for(let x=25;x<=37;x+=3){box(x,.65,7,.12,1.3, .12,0x876a45);box(x,.65,-7,.12,1.3,.12,0x876a45)}box(31,1,7,13,.12,.12,0x876a45);box(31,1,-7,13,.12,.12,0x876a45);
function deer(x,z){let body=new THREE.Mesh(new THREE.SphereGeometry(.65,12,10),mat(0xb68b5e));body.scale.set(1.35,.8,.75);body.position.set(x,1,z);scene.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),mat(0xb68b5e));head.position.set(x+.85,1.55,z);scene.add(head);for(let dx of [-.35,.35])for(let dz of [-.22,.22]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.65,7),mat(0x755338));leg.position.set(x+dx,.48,z+dz);scene.add(leg)}}
deer(29,-1);deer(34,2);
function stall(){box(-31,.8,23,5,1.6,3,0x806044);box(-31,2,23,6,.18,3.5,0x8b4935);for(let x of [-33.5,-28.5])box(x,1.3,23,.15,2.6,.15,0x60432c)}stall();
function incense(x,z){let base=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.45,.7,16),mat(0x66564a));base.position.set(x,.38,z);scene.add(base);let bowl=new THREE.Mesh(new THREE.CylinderGeometry(.95,1.15,.25,16),mat(0x9b7849));bowl.position.set(x,.85,z);scene.add(bowl);for(let i=0;i<4;i++){let stick=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.9,6),mat(0x4a3427));stick.position.set(x+(i-1.5)*.22,1.35,z);scene.add(stick)}}
incense(0,4);incense(-4,0);incense(4,0);
// lamps, rocks, perimeter trees
for(let i=0;i<18;i++){let a=i/18*Math.PI*2;let x=Math.cos(a)*49,z=Math.sin(a)*49;tree(x,z,.8)}
for(let x of [-10,10])for(let z of [-10,10]){let b=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.2,8),mat(0x6b5840));b.position.set(x,.6,z);scene.add(b);let l=new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),mat(0xe7c58a));l.position.set(x,1.35,z);scene.add(l)}
// area markers and labels
areas.forEach(a=>{if(!a.w&&!a.tree&&!a.yard&&!a.deer&&!a.stall&&!a.peach&&!a.center){return}if(a.yard){let p=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.1,24),mat(0x71876a));p.position.set(a.x,.06,a.z);scene.add(p)}if(a.stall){}if(a.center){textSprite('香火广场',0,3.1,8)}else if(a.tree){textSprite(a.name,a.x,7.2,a.z+2)}else if(a.peach){textSprite(a.name,a.x,7,a.z+2)}else{textSprite(a.name,a.x,a.h? a.h+1.8:3.2,a.z+ (a.d? a.d/2+1:2))}});
const player=new THREE.Group();
const monk=new THREE.Group();player.add(monk);
const robeMat=mat(0x76513d), robeLight=mat(0x9a704d), skinMat=mat(0xd5ad88), darkMat=mat(0x3d3028);
function limb(parent,geo,material,x,y,z){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
// 宽袖僧袍躯干与衣摆
limb(monk,new THREE.CylinderGeometry(.34,.53,1.12,12),robeMat,0,.88,0);
limb(monk,new THREE.CylinderGeometry(.50,.53,.16,12),robeLight,0,.34,0);
limb(monk,new THREE.SphereGeometry(.22,12,10),skinMat,0,1.53,0);
limb(monk,new THREE.SphereGeometry(.285,16,12),skinMat,0,1.88,0);
// 剃度头部、耳朵与简单面部
limb(monk,new THREE.SphereGeometry(.292,16,12),mat(0x49372d),0,1.96,0);
limb(monk,new THREE.SphereGeometry(.055,8,8),skinMat,-.29,1.9,0);
limb(monk,new THREE.SphereGeometry(.055,8,8),skinMat,.29,1.9,0);
limb(monk,new THREE.SphereGeometry(.025,8,8),darkMat,-.105,1.98,.265);
limb(monk,new THREE.SphereGeometry(.025,8,8),darkMat,.105,1.98,.265);
// 交叠袈裟布带
const sash=limb(monk,new THREE.BoxGeometry(.16,.9,.045),robeLight,.08,.91,.31);sash.rotation.z=-.28;
// 肩部摆臂：走路时自然前后摆动
const armL=new THREE.Group();armL.position.set(-.39,1.31,0);monk.add(armL);
limb(armL,new THREE.CylinderGeometry(.13,.105,.67,10),robeMat,0,-.31,0).rotation.z=-.12;
limb(armL,new THREE.SphereGeometry(.115,10,8),skinMat,0,-.69,.015);
const armR=new THREE.Group();armR.position.set(.39,1.31,0);monk.add(armR);
limb(armR,new THREE.CylinderGeometry(.13,.105,.67,10),robeMat,0,-.31,0).rotation.z=.12;
limb(armR,new THREE.SphereGeometry(.115,10,8),skinMat,0,-.69,.015);
// 袍下露出的裤脚与布鞋
const legL=new THREE.Group();legL.position.set(-.19,.36,0);monk.add(legL);
limb(legL,new THREE.CylinderGeometry(.115,.10,.42,9),darkMat,0,-.13,0);
limb(legL,new THREE.BoxGeometry(.22,.12,.38),darkMat,0,-.36,.09);
const legR=new THREE.Group();legR.position.set(.19,.36,0);monk.add(legR);
limb(legR,new THREE.CylinderGeometry(.115,.10,.42,9),darkMat,0,-.13,0);
limb(legR,new THREE.BoxGeometry(.22,.12,.38),darkMat,0,-.36,.09);
player.position.set(0,0,10);scene.add(player);
let yaw=0,pitch=.28,dist=8;const keys={};let sound=false,audioCtx=null;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.05,Math.min(.85,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(4,Math.min(15,dist+e.deltaY*.008))});
let joy={x:0,y:0},joyEl=document.getElementById('joy'),stick=document.getElementById('stick'),joyOn=false;
joyEl.addEventListener('pointerdown',e=>{joyOn=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(joyOn)moveJoy(e)});function moveJoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}function endJoy(){joyOn=false;joy.x=joy.y=0;stick.style.transform=''}joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
let look=document.getElementById('look'),lookOn=false,lx=0,ly=0;look.addEventListener('pointerdown',e=>{lookOn=true;look.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY});look.addEventListener('pointermove',e=>{if(lookOn){yaw-=(e.clientX-lx)*.009;pitch=Math.max(-.05,Math.min(.85,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});look.addEventListener('pointerup',()=>lookOn=false);look.addEventListener('pointercancel',()=>lookOn=false);
function nearest(){let best=null,bd=1e9;for(const a of areas){let d=Math.hypot(player.position.x-a.x,player.position.z-a.z);if(d<bd){bd=d;best=a}}return bd<8?best:null}
function interact(){let a=nearest();if(!a){toast('附近没有可互动的景点');return}document.getElementById('ptitle').textContent=a.name;document.getElementById('ptext').textContent=a.desc;document.getElementById('panel').style.display='flex'}
document.getElementById('close').onclick=()=>document.getElementById('panel').style.display='none';
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',1800)}
function beep(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(520,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(260,audioCtx.currentTime+1.3);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+2);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+2)}
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent='♫ 声音：'+(sound?'开启':'关闭');if(sound){beep();toast('测试钟声音已开启')}else toast('声音已关闭')};
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;let len=Math.hypot(forward,side);if(len>1){forward/=len;side/=len}let speed=8;let dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;let dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;player.position.x=THREE.MathUtils.clamp(player.position.x+dx,-57,57);player.position.z=THREE.MathUtils.clamp(player.position.z+dz,-57,57);if(len>.08)player.rotation.y=Math.atan2(dx,dz);
const moving=len>.08;
const walkT=clock.elapsedTime*9;
const swing=moving?Math.sin(walkT)*.52:0;
legL.rotation.x=swing;legR.rotation.x=-swing;
armL.rotation.x=-swing*.72;armR.rotation.x=swing*.72;
monk.position.y=moving?Math.abs(Math.sin(walkT*2))*.035:0;
monk.rotation.z=moving?Math.sin(walkT)*.018:0;
let target=new THREE.Vector3(player.position.x-Math.sin(yaw)*dist,2.7+pitch*5,player.position.z-Math.cos(yaw)*dist);camera.position.lerp(target,.14);camera.lookAt(player.position.x,1.25,player.position.z);
let a=nearest(),hint=document.getElementById('hint');if(a){hint.style.display='block';hint.innerHTML=`附近：<b>${a.name}</b><br>按 E 键 / 靠近后互动` }else hint.style.display='none';
renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
